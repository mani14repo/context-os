[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextos"
version = "0.1.0"
description = "A lightweight, agent-neutral context operating system for governed multi-tier AI memory."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "ContextOS Contributors"}]
keywords = ["ai", "agents", "memory", "context-engineering", "rag", "knowledge-graph"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed"
]
dependencies = ["pydantic>=2.8,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
langgraph = ["langgraph>=0.2"]
postgres = ["asyncpg>=0.29", "pgvector>=0.3"]
redis = ["redis>=5"]
s3 = ["aioboto3>=13"]
azure-blob = ["azure-storage-blob>=12", "aiohttp>=3.8,<4"]
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
mcp = ["mcp>=1.0"]
a2a = ["a2a-sdk>=0.2"]
documents = ["pypdf>=4", "python-docx>=1"]
ml = ["xgboost>=2", "numpy>=1.24"]
http = ["httpx>=0.27"]
kafka = ["aiokafka>=0.11"]
mattermost = ["httpx>=0.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13", "types-protobuf"]

[project.urls]
Homepage = "https://github.com/mani14repo/context-os"
Repository = "https://github.com/mani14repo/context-os"
Issues = "https://github.com/mani14repo/context-os/issues"

[project.scripts]
contextos-api = "contextos.api.app:main"
contextos-mcp = "contextos.integrations.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "pgvector.*", "aioboto3.*", "botocore.*", "aiokafka.*"]
ignore_missing_imports = true
