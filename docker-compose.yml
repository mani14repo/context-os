services:
  contextos:
    build: .
    ports:
      - "8080:8080"
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: contextos
      POSTGRES_DB: contextos
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    # --skipApiVersionCheck: recent azure-storage-blob SDK releases send API versions
    # newer than this image supports; without the flag every request 400s.
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"
